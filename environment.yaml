# Manages the conda environment: Python version and any non-Python dependencies
# (e.g. system libraries, CUDA, BLAS). Pure Python dependencies are in pyproject.toml.
name: behavior-similarity-search
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - make
  - uv
  - act  # dev dependency - for running GitHub Actions workflows locally
