[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-similarity-search-valkey"
version = "0.1.0"
description = "Valkey (with Vector Similarity Search support) client for BehaviorSimilaritySearch."
requires-python = ">=3.12"
dependencies = [
    "behavior-similarity-search-core",
    "valkey[libvalkey]==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
