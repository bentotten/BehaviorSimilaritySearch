[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-similarity-search-core"
version = "0.1.0"
description = "Core library for BehaviorSimilaritySearch."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
