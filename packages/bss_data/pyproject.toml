[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-similarity-search-data"
version = "0.1.0"
description = "Dataset loading and data pipeline utilities for BehaviorSimilaritySearch."
requires-python = ">=3.12"
dependencies = [
    "behavior-similarity-search-core",
    "Pillow==11.2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
