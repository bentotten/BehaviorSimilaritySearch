# cargo-nextest configuration.
# 
# See: https://nexte.st/docs/configuration/

[profile.default]
# Any single test still running after 60s is considered slow and is forcibly
# terminated (and reported as a failure) after one 60s period. This is a safety
# net against hangs (e.g. an infinite loop in library code under test) so the
# suite can never block indefinitely.
slow-timeout = { period = "60s", terminate-after = 1 }
