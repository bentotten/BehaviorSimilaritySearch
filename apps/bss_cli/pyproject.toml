[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-similarity-search-cli"
version = "0.1.0"
description = "CLI application for BehaviorSimilaritySearch."
requires-python = ">=3.12"
dependencies = [
    "behavior-similarity-search-core",
    "behavior-similarity-search-data",
    "behavior-similarity-search-encoder",
    "behavior-similarity-search-valkey",
]

[project.scripts]
behavior-similarity-search = "bss_cli.cli:main"
bss = "bss_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
